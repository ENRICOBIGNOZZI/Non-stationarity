name: Reproduce full benchmark
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test,report]'
      - run: python -m pytest -q
      - run: python -m nonstationarity.experiment --config configs/full.json --out results/full --jobs 2
      - run: python -m nonstationarity.temporal_oracle --out results/temporal_oracle
      - run: python -m nonstationarity.analysis --input results/full --out results/analysis
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-benchmark-results
          path: results
          retention-days: 30
