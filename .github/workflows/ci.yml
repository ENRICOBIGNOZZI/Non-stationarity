name: Tests and chronological smoke benchmark
on:
  push:
    branches: [main, research/joint-memory-benchmark]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test,report]'
      - run: python -m pytest -q
      - run: python -m nonstationarity.experiment --config configs/smoke.json --out results/smoke --jobs 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-results
          path: results/smoke
          retention-days: 14
