name: Bootstrap benchmark dependency
on:
  push:
    branches: [research/joint-memory-benchmark]
    paths: [.github/workflows/bootstrap-dependency.yml]
permissions:
  contents: read
jobs:
  wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip download --no-deps --only-binary=:all: river==0.22.0 -d wheels
      - uses: actions/upload-artifact@v4
        with:
          name: river-wheel-cp311
          path: wheels/*.whl
          retention-days: 2
