[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nonstationarity-benchmark"
version = "0.1.0"
description = "Chronological joint-memory neural regression benchmark"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3", "scipy>=1.14,<2", "pandas>=2.2,<4",
  "torch>=2.5,<3", "scikit-learn>=1.5,<2", "threadpoolctl>=3.5",
  "river==0.22.0"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
report = ["matplotlib>=3.9,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
